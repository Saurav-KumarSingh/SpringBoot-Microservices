spring.application.name=apigateway


server.port=8080

server.servlet.context-path=/api

logging.level.org.springframework.cloud.gateway=DEBUG

#Microservice Routing ->  using Declarative way OR properties file
    #Context-path, Port number

# user-service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# order-service
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/order/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# payment-service
spring.cloud.gateway.server.webmvc.routes[2].id=payment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/payment/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1


#Eureka config
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka